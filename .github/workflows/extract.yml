name: Extract Game Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -q "Galaxy-Defender-EXTRACTED-GitHub-Ready-v1.0.2.zip" -d extracted

          cp -R extracted/. .

          rm -rf extracted
          rm -f "Galaxy-Defender-EXTRACTED-GitHub-Ready-v1.0.2.zip"

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet || git commit -m "Extract Galaxy Defender v1.0.2 project"

          git push
